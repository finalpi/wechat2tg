name: Build and Push Docker Image

on:
  push:
    branches:
      - 'wx2tg-pad-dev'

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get run number
        id: version
        run: echo "VERSION=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: finalpi/wechat2tg-pad-dev:${{ env.VERSION }}, finalpi/wechat2tg-pad-dev:latest
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/amd64.tar

      - name: Upload amd64 artifact
        uses: actions/upload-artifact@v3
        with:
          name: amd64-image
          path: /tmp/amd64.tar
          retention-days: 1

  build-arm64:
    runs-on: ubuntu-latest-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get run number
        id: version
        run: echo "VERSION=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: finalpi/wechat2tg-pad-dev:${{ env.VERSION }}, finalpi/wechat2tg-pad-dev:latest
          platforms: linux/arm64/v8
          outputs: type=docker,dest=/tmp/arm64.tar

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v3
        with:
          name: arm64-image
          path: /tmp/arm64.tar
          retention-days: 1

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Get run number
        id: version
        run: echo "VERSION=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Download amd64 image
        uses: actions/download-artifact@v3
        with:
          name: amd64-image
          path: /tmp

      - name: Download arm64 image
        uses: actions/download-artifact@v3
        with:
          name: arm64-image
          path: /tmp

      - name: Load images into Docker
        run: |
          docker load -i /tmp/amd64.tar
          docker load -i /tmp/arm64.tar

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push multi-arch images
        run: |
          docker push finalpi/wechat2tg-pad-dev:${{ env.VERSION }}
          docker push finalpi/wechat2tg-pad-dev:latest
