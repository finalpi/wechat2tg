name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v6.*'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate release and test
        shell: bash
        run: |
          set -euo pipefail
          npm run check:version
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF_TYPE" == "tag" ]]; then
            APP_VERSION="$GITHUB_REF_NAME"
            IMAGE_TAGS="finalpi/wechat2tg-v3:$APP_VERSION,finalpi/wechat2tg-v3:v6-latest"
          else
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                  "$GITHUB_REF" != "refs/heads/v6" ]]; then
              echo 'Manual builds must use branch v6'
              exit 1
            fi
            APP_VERSION="v6-dev-${GITHUB_SHA:0:7}"
            IMAGE_TAGS="finalpi/wechat2tg-v3:$APP_VERSION"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          platforms: linux/amd64,linux/arm64/v8

      - name: Docker Hub Description
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: finalpi/wechat2tg-v3
          readme-filepath: ./README.md
          short-description: 'Telegram收发微信消息'
